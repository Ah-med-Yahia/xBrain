name: explaino
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1
environment:
  sdk: ^3.10.7



dependencies:
  flutter:
    sdk: flutter

  # ===============================
  # UI / Design / Animations
  # ===============================

  cupertino_icons: ^1.0.8          # iOS-style icons
  flutter_svg: ^2.2.3               # SVG support
  cached_network_image: ^3.4.1      # Image caching
  google_fonts: ^6.3.3              # Google Fonts
  lottie: ^3.3.2                    # Lottie animations
  carousel_slider: ^5.1.1           # Image / content sliders
  pinput: ^6.0.1                    # OTP / PIN input UI
  image_picker: ^1.2.1              # Image picker
  mime: ^1.0.5                      # Mime type
  http_parser: ^4.0.2               # HTTP parser
  flutter_image_compress: ^2.4.0    # Image compression
  path_provider: ^2.1.5             # Path provider
  path: ^1.9.1                      # Path
  flutter_launcher_icons: ^0.14.4   # App launcher icons
  # ===============================
  # App Setup / Splash
  # ===============================

  flutter_native_splash: ^2.4.7     # Native splash screen
  rename_app: ^1.6.5                # Rename app (package, app name)

  # ===============================
  # State Management
  # ===============================

  flutter_bloc: ^9.1.1              # BLoC / Cubit state management
  equatable: ^2.0.7                 # Value comparison for states
  freezed_annotation: ^3.0.0        # Immutable models / unions

  # ===============================
  # Navigation
  # ===============================

  go_router: ^17.0.1                # Declarative navigation

  # ===============================
  # Dependency Injection
  # ===============================

  get_it: ^9.2.0                    # Service locator
  injectable: ^2.7.1+4              # Code generation for DI

  # ===============================
  # Networking / API
  # ===============================

  dio: ^5.9.0                       # HTTP client
  retrofit: ^4.9.2                  # Typed API client

  # ===============================
  # Serialization
  # ===============================

  json_annotation: ^4.9.0           # JSON serialization annotations

  # ===============================
  # Local Storage
  # ===============================

  shared_preferences: ^2.5.4        # Simple key-value storage
  flutter_secure_storage: ^10.0.0   # Encrypted storage

  # ===============================
  # User Feedback
  # ===============================

  fluttertoast: ^9.0.0              # Toast messages

  # ===============================
  # Debugging / Logging
  # ===============================

  logger: ^2.6.2                    # Logging utility
  pretty_dio_logger: ^1.4.0         # Network logs interceptor
  flutter_easyloading: ^3.0.5
  shimmer: ^3.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
    # Code generation tools
  build_runner: ^2.6.0
  freezed: ^3.0.0
  injectable_generator: ^2.7.0
  json_serializable: ^6.7.1
  retrofit_generator: ^10.2.1
  flutter_gen_runner: ^5.9.0
  mockito: ^5.5.1
  test: ^1.26.2
  bloc_test: ^10.0.0
  

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_gen:
  output: lib/core/gen/
  integrations:
    lottie: true
    flutter_svg: true
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: false


